# =============================================================================
# config.yaml  —  single source of truth for tickers, dates, and parameters
# =============================================================================
# Stages 1-2 only (data + features). Model/backtest params live elsewhere later.

date_range:
  start: "2010-01-01"
  end: null            # null => today at pull time

# -----------------------------------------------------------------------------
# Yahoo Finance tickers (pulled via yfinance). Grouped by role.
# GC=F (COMEX gold) is deep and liquid on Yahoo — data thinness is NOT expected
# to be a problem. The pull step still reports exactly what we get; verify,
# don't assume.
# -----------------------------------------------------------------------------
yahoo:
  target:
    GC=F: gold_comex                # primary asset (continuous front-month)
  cross_asset:
    SI=F:  silver_comex             # co-metal; gold/silver ratio is the classic signal
    DX-Y.NYB: dxy                   # USD strength (gold is priced in USD; inverse beta)
    ^VIX:  vix                      # risk sentiment / safe-haven demand proxy
  equity_proxies:
    GDX:  gold_miners               # producer equities (leveraged flow/sentiment proxy)

# -----------------------------------------------------------------------------
# FRED series (pulled via free fredgraph.csv endpoint; no API key needed).
# frequency + release_lag_months drive point-in-time alignment in features.py.
# release_lag_months is a CONSERVATIVE assumption, not true ALFRED vintage data.
# Real yields are THE textbook gold driver (opportunity cost of a zero-yield
# asset); inflation expectations and realized CPI complete the macro picture.
# -----------------------------------------------------------------------------
fred:
  DFII10:   {name: real_10y,       freq: daily,   release_lag_months: 0}
  T10YIE:   {name: infl_breakeven, freq: daily,   release_lag_months: 0}
  CPIAUCSL: {name: us_cpi,         freq: monthly, release_lag_months: 1}

# -----------------------------------------------------------------------------
# Data validation thresholds
# -----------------------------------------------------------------------------
validation:
  stale_min_run: 4            # >= this many identical consecutive closes => flag
  outlier_return_z: 6.0       # |z-score| of log return above this => flag
  outlier_return_hard: 0.20   # |single-day log return| above this => flag (20%)
  max_forward_fill_days: 5    # gaps longer than this are reported, not filled

# -----------------------------------------------------------------------------
# Futures roll handling (see rolls.py — heuristic; honest limitations documented)
# GC=F active contracts are Feb/Apr/Jun/Aug/Oct/Dec — rolls cluster near month
# boundaries of those months; the month-boundary heuristic still applies.
# -----------------------------------------------------------------------------
rolls:
  jump_z: 5.0                 # |log-return z| above this is a roll *candidate*
  jump_hard: 0.08             # OR |log return| above this near a month boundary
  month_boundary_window: 5    # trading days near month-end/start to weight rolls
  method: neutralize          # "neutralize" (default) | "ratio_backadjust"

# -----------------------------------------------------------------------------
# Feature engineering
# -----------------------------------------------------------------------------
features:
  return_lookbacks: [1, 5, 20]
  vol_window: 20
  rsi_window: 14
  ma_windows: [20, 50]
  zscore_window: 60           # for gold/silver ratio z-score, rolling stats
  corr_window: 60             # rolling corr with DXY
  beta_window: 60             # rolling gold beta to real-yield CHANGES
  vol_regime_window: 60       # realized-vol percentile window for regime flag

# -----------------------------------------------------------------------------
# Prediction label (defined here so features never accidentally reuse it)
# -----------------------------------------------------------------------------
label:
  # Horizon sweep (reports/model/horizon_sweep.md, 2026-07): signal is strongest
  # at 1d and decays monotonically with N — the only horizon where a baseline
  # beats naive on BOTH heads (ridge RMSE/naive 0.997, IC +0.108; logistic acc
  # 0.543 vs 0.521 base, AUC 0.545). Consistent with a feature set of fast daily
  # signals. 5/10/20 remain available via `python -m src.evaluate --horizons`.
  horizon_days: 1             # N-day forward log return (primary)

# -----------------------------------------------------------------------------
# Stage 3 — modelling (baselines + walk-forward XGBoost). Two heads run side by
# side on the SAME folds: regression on the forward log return, and
# classification on its sign. Nothing here is a strategy — costs, sizing and the
# backtest are stage 4+. This stage only asks: can a model forecast, and does it
# beat a naive benchmark out-of-sample (the bar the README sets).
# -----------------------------------------------------------------------------
model:
  # Walk-forward evaluation. Expanding train window, refit each fold. The label
  # is an N-day FORWARD return, so consecutive rows overlap by N-1 days; the
  # embargo purges the N rows straddling each train/test boundary so no training
  # label peeks into the test window (López de Prado purging). Default embargo
  # (null) = label.horizon_days.
  walk_forward:
    scheme: expanding           # expanding | rolling
    min_train_days: 756         # ~3 trading years before the first out-of-sample fold
    test_days: 63               # ~1 quarter of out-of-sample rows per fold
    embargo_days: null          # null => label.horizon_days
    momentum_col: ret_20d       # trailing signal the momentum baselines use

  # XGBoost — deliberately shallow and regularized. Daily gold returns are a
  # low-signal, noisy, smallish dataset; deep trees just memorize. Same params
  # for both heads (regressor vs classifier).
  xgboost:
    n_estimators: 300
    max_depth: 3
    learning_rate: 0.03
    subsample: 0.8
    colsample_bytree: 0.8
    min_child_weight: 5
    reg_lambda: 1.0
    random_state: 42

  ridge_alpha: 1.0              # linear regression baseline (L2)
  logistic_C: 1.0              # logistic baseline (inverse L2)

# -----------------------------------------------------------------------------
# Stage 4 — strategy layer + backtest. Positions are built from the STITCHED
# walk-forward OOS predictions (data/processed/oos_predictions.csv), i.e. only
# forecasts a live trader could actually have had. Convention: a signal at
# close t sets the position earning the t -> t+1 close-to-close return.
# Benchmarks (buy-and-hold, momentum rule) run through the SAME vol-targeting /
# cost machinery so the comparison is like-for-like.
# -----------------------------------------------------------------------------
strategy:
  signals: [reg_ridge, clf_logistic]   # models that cleared the stage-3 gate
  mode: long_flat             # long_flat | long_short
  vol_target_ann: 0.10        # annualized vol target; null disables scaling
  vol_window: 20              # trailing window for realized vol (known at t)
  max_leverage: 2.0           # cap on |position| after vol scaling
  cost_bps: 1.0               # one-way cost per unit turnover (GC futures ~0.5-1bp)
  stop:                       # trailing equity stop (per strategy)
    max_drawdown: 0.10        # flatten when drawdown from peak exceeds this
    cooldown_days: 5          # stay flat this many days after a stop fires
  trading_days: 252
